<!DOCTYPE html>
<html>
<head>
    <title>Books</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>Books</h1>

    <div class="box">

        <h2>Available Books</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Status</th>
            </tr>

            {% for book in books %}
            <tr>
                <td>{{ book["id"] }}</td>
                <td>{{ book["name"] }}</td>
                <td>{{ book["author"] }}</td>
                <td>{{ book["status"] }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
